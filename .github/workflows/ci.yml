name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: casa_security_20261028
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_security_20261028
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U casa_security_20261028 -d casa_security_20261028"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Banco temporário exclusivo do CI
      DATABASE_URL: postgresql://casa_security_20261028:postgres@127.0.0.1:5432/casa_security_20261028?schema=public
      TEST_DATABASE_URL: postgresql://casa_security_20261028:postgres@127.0.0.1:5432/casa_security_20261028?schema=public
      NODE_ENV: test

      # Chave exclusiva para testes do CI
      JWT_SECRET: ci-test-secret-nao-usar-em-producao

      # Valores fictícios para permitir a inicialização do backend
      CLOUDINARY_CLOUD_NAME: ci-test-cloud
      CLOUDINARY_API_KEY: ci-test-key
      CLOUDINARY_API_SECRET: ci-test-secret

      # Chave fictícia: só destrava a instanciação do client Resend no import de app.ts.
      # Nenhum teste faz uma chamada real (a única suíte que envia e-mail mocka o serviço).
      RESEND_API_KEY: re_ci_test_key

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditar dependências backend
        run: bun audit --audit-level=high

      - name: Gerar Prisma Client
        run: bunx --bun prisma generate

      - name: Validar schema Prisma
        run: bunx --bun prisma validate

      - name: Aplicar migrations no banco de teste
        run: bunx --bun prisma migrate deploy

      - name: Lint
        run: bun run lint

      - name: Checar formatação (Prettier)
        run: bunx prettier --check .

      - name: Testes
        # O serviço acima é criado para este job e descartado pelo GitHub Actions.
        # A autorização expira e vincula a guarda à conexão exclusiva deste serviço.
        run: |
          bun --no-env-file -e '
            const { createHash } = await import("node:crypto");
            const { writeFileSync } = await import("node:fs");
            const connection = process.env.TEST_DATABASE_URL;
            if (!connection || connection !== process.env.DATABASE_URL) {
              throw new Error("Configuração de banco de CI inconsistente");
            }
            writeFileSync(".test-database-authorization.json", JSON.stringify({
              task: "security-and-data-protection",
              disposable: true,
              connectionSha256: createHash("sha256").update(connection).digest("hex"),
              expiresAt: new Date(Date.now() + 60 * 60 * 1000).toISOString(),
            }), { flag: "wx", mode: 0o600 });
          '
          bun run test

      - name: Remover autorização temporária
        if: always()
        run: rm -f .test-database-authorization.json

      - name: Build
        run: bun run build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditar dependências frontend
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Checar formatação (Prettier)
        run: bunx prettier --check .

      - name: Testes
        run: bun run test:run

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: casa_security_20261028
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_security_20261028
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U casa_security_20261028 -d casa_security_20261028"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://casa_security_20261028:postgres@127.0.0.1:5432/casa_security_20261028?schema=public
      TEST_DATABASE_URL: postgresql://casa_security_20261028:postgres@127.0.0.1:5432/casa_security_20261028?schema=public
      JWT_SECRET: rf44-disposable-session-key-32-bytes-only
      RESEND_API_KEY: re_rf44_test_only
      CLOUDINARY_CLOUD_NAME: rf44-test
      CLOUDINARY_API_KEY: rf44-test
      CLOUDINARY_API_SECRET: rf44-test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Instalar backend
        working-directory: back-end
        run: bun install --frozen-lockfile
      - name: Instalar frontend
        working-directory: front-end
        run: bun install --frozen-lockfile
      - name: Autorizar somente a conexão do serviço descartável
        working-directory: back-end
        run: bun --no-env-file tests/authorize-ci.mjs
      - name: Gerar e validar Prisma e aplicar migrations descartáveis
        working-directory: back-end
        run: |
          bunx --bun prisma generate
          bunx --bun prisma validate
          bunx --bun prisma migrate deploy
      - name: Preparar fixtures sintéticas
        working-directory: back-end
        run: |
          bunx tsc -p tests/tsconfig.json
          bunx tsx tests/e2e/seed.ts
      - name: Instalar Chromium
        working-directory: front-end
        run: bunx playwright install --with-deps chromium
      - name: E2E real (servidores e health checks geridos pelo Playwright)
        working-directory: front-end
        run: |
          bun run test:e2e:typecheck
          bun run test:e2e:ci
      - name: Publicar evidências sem cookies ou traces de rede
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            front-end/test-results/**/*.png
            front-end/test-results/junit.xml
            front-end/playwright-report/index.html
      - name: Limpar fixtures e autorização
        if: always()
        working-directory: back-end
        run: |
          trap 'rm -f .test-database-authorization.json' EXIT
          if [ -f .test-database-authorization.json ]; then
            bunx tsx tests/e2e/cleanup.ts
          fi
      - name: Remover traces privados do runner
        if: always()
        run: |
          rm -rf front-end/test-results front-end/playwright-report

