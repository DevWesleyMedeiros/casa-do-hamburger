## Workflow de Review\r
 \r
## Verificação de Regras de Negócio (casa-do-hamburguer)\r
 \r
Sempre que uma revisão de código for solicitada para o projeto Casa do Hambúrguer, além dos\r
critérios técnicos padrão desta skill, o revisor deve:\r
 \r
1. Ler `docs/architecture/REGRAS_DE_NEGOCIO.md` (na raiz do repositório) antes de opinar sobre o PR/diff.\r
2. Identificar quais RF/RN/RNF do documento o trecho revisado toca (ex.: um PATCH em rota de\r
   carrinho → RN-CART-02, RN-CART-05, RN-CART-06).\r
3. Verificar se a implementação é **fiel** à regra descrita — não apenas "está limpo", mas\r
   "está certo com o que foi decidido".\r
4. Sinalizar explicitamente se o código:\r
   - implementa um comportamento **não documentado** no `.md` (pode ser regra nova não registrada, ou desvio indevido do que foi decidido);\r
   - contradiz uma regra já marcada como 🟢 (implementada) — tratar como regressão, prioridade alta;\r
   - fecha um item que hoje está 🟡/🔵 — sinalizar que o selo do `.md` precisa ser atualizado.\r
5. Conferir aderência ao checklist de PR abaixo antes de aprovar:\r
\\```markdown\r
## Checklist do PR — Casa do Hambúrguer\r
- [ ] Referencia o(s) RF/RN/RNF impactado(s) na descrição do PR (ex.: RF-30, RN-CART-06)\r
- [ ] REGRAS_DE_NEGOCIO.md foi atualizado (selo trocado 🟡/🔵 → 🟢, ou nova regra registrada)\r
- [ ] Se mudou uma decisão arquitetural relevante, foi criado um ADR em /docs/architecture/adr/\r
- [ ] Testes (unit e/ou integração) cobrindo a regra de negócio adicionados/atualizados\r
- [ ] Nenhuma regra 🟢 existente foi quebrada\r
\\```\r
### Passo 1 — Levantamento das Mudanças\r
 \r
```bash\r
# Identificar o que mudou\r
git status\r
git diff main --stat        # volume de mudanças — PR > 400 linhas é sinal de alerta\r
git diff main               # diff completo para análise\r
 \r
# Rodar automação antes da análise humana\r
bun run lint                # ESLint — reportar somente se houver erros\r
bunx prettier --check .      # Prettier — reportar somente se houver divergências\r
bun test      # testes existentes nativo do bun — verificar se quebrou algo\r
```\r
 \r
### Passo 2 — Leitura de Contexto\r
 \r
Antes de analisar qualquer linha de código:\r
- Entenda qual **problema de negócio** o PR resolve\r
- Leia a **descrição do PR** (se houver) para entender a intenção\r
- Identifique **quais camadas** foram afetadas (frontend / backend / API / documentação / infra)\r
- Consulte `context7` ou `web-modern-guidance` para verificar práticas atualizadas das libs envolvidas quando necessário\r
### Passo 3 — Revisão por Camada (na ordem da pirâmide)\r
 \r
Para cada arquivo alterado, usando as Perguntas-Guia acima:\r
 \r
1. **Regra de negócio** — a lógica implementada corresponde ao requisito?\r
2. **Segurança** — controle de acesso, validação de input, dados sensíveis expostos, robustez?\r
3. **Testes** — mudança tem teste? asserções são reais? casos de borda e NFRs cobertos?\r
4. **Performance** — N+1 no Prisma? algoritmos custosos? re-renders desnecessários?\r
5. **Semântica de API** — contrato consistente? DTO sem vazar internals? sem breaking change?\r
6. **Design** — responsabilidade única? acoplamento excessivo? duplicação evitável?\r
7. **Documentação** — README, `REGRAS_DE_NEGOCIO.md`, ADR e Swagger atualizados quando necessário?\r
8. **Clareza** — código auto-explicativo? nomes descritivos? TypeScript correto (sem `any`)?\r
9. **Estilo** — já coberto pelo Bash/lint acima; não comentar aqui\r
### Passo 4 — Encerramento\r
 \r
- Ao finalizar todos os arquivos, **pare e aguarde a ação do autor**\r
- Se não houver problemas relevantes, diga isso **explicitamente**\r
- Agrupe os comentários por tipo no resumo final (quantos 🚨, ⚠️, 💡)\r
---\r
 \r
## Sistema de Comentários\r
 \r
Todo comentário deve seguir o modelo:\r
```\r
[Tipo] [Contexto breve] → [O que está errado e por quê] + [Sugestão com exemplo]\r
```\r
 \r
| Tipo | Significado | Bloqueia merge? |\r
|---|---|---|\r
| `🚨 Bloqueador:` | Bug, falha de segurança, regra de negócio errada | ✅ Sim |\r
| `⚠️ Importante:` | Performance séria, dívida técnica relevante | Depende |\r
| `💡 Sugestão:` | Melhoria não obrigatória, abordagem melhor | ❌ Não |\r
| `❓ Dúvida:` | Preciso entender a intenção antes de julgar | ❌ Não |\r
| `📝 Nit:` | Pequena melhoria de clareza, baixíssima prioridade | ❌ Não |\r
| `✅ Elogio:` | Boa prática que merece reconhecimento explícito | — |\r
 \r
### Exemplos com o Stack do Projeto\r
 \r
```\r
🚨 Bloqueador: este endpoint busca o pedido pelo ID da URL sem verificar\r
se pertence ao usuário autenticado — brecha de IDOR (OWASP A01).\r
Adicione: `where: { id: params.id, userId: req.user.id }` na query Prisma.\r
 \r
⚠️ Importante: o componente CartList está fazendo uma chamada Axios\r
dentro de um loop de items — N chamadas por render. Mova para fora\r
do loop com Promise.all() ou ajuste a API para receber os IDs em batch.\r
 \r
💡 Sugestão: o hook useCartStore está selecionando o objeto inteiro do Zustand\r
via `useCartStore()` — isso causa re-render desnecessário quando qualquer\r
campo muda. Use seletores individuais: `useCartStore(s => s.items)`.\r
 \r
❓ Dúvida: a validação do CPF está acontecendo apenas no frontend com Zod.\r
Há validação no backend também? Se não, um cliente pode enviar qualquer\r
valor direto via API.\r
 \r
✅ Elogio: excelente uso de `useShallow` para evitar re-renders no seletor\r
do Zustand — esse padrão resolve o problema de comparação por referência\r
em objetos.\r
```\r
