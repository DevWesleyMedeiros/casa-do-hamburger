## Checklists de Processo\r
 \r
### ✅ Checklist de PR — autor preenche antes de abrir\r
 \r
```markdown\r
### Regra de Negócio\r
- [ ] O PR resolve o problema descrito na issue/tarefa?\r
- [ ] Casos de borda do requisito foram considerados?\r
- [ ] Há impacto em funcionalidades existentes (carrinho, auth, produtos)?\r
 \r
### Tamanho e Foco\r
- [ ] O PR tem menos de 400 linhas alteradas?\r
- [ ] O PR tem responsabilidade única (uma mudança coesa)?\r
 \r
### Qualidade\r
- [ ] `bun run lint` passa sem erros?\r
- [ ] Sem `any` sem justificativa, `console.log` ou código comentado morto?\r
 \r
### Testes\r
- [ ] Testes adicionados ou atualizados?\r
- [ ] `bun test` passa localmente?\r
- [ ] Nível de teste adequado (unit vs integração)? Há cobertura de NFR quando relevante?\r
 \r
### Segurança\r
- [ ] Nenhum segredo ou .env commitado?\r
- [ ] Inputs validados no backend com Zod?\r
- [ ] Controle de acesso verificado nos endpoints novos?\r
 \r
### API\r
- [ ] Contrato de resposta é um DTO explícito, sem vazar internals?\r
- [ ] Sem breaking change não sinalizada em rota já existente?\r
 \r
### Documentação\r
- [ ] REGRAS_DE_NEGOCIO.md, README ou Swagger atualizados se necessário?\r
```\r
 \r
