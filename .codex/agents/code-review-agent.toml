## Cobertura Fullstack — Checklist por Camada\r
 \r
### Frontend (React + TypeScript + Tailwind + Zustand)\r
 \r
```\r
□ Componentes com responsabilidade única (SRP)?\r
□ Props tipadas — sem `any` solto?\r
□ Listas com `key` estável (não índice do array)?\r
□ useEffect com dependências corretas + cleanup?\r
□ Seletores Zustand individuais ou com useShallow?\r
□ Formulários validados com React Hook Form + Zod no cliente E no backend?\r
□ Loading, error e empty states tratados na UI?\r
□ Axios com withCredentials: true nos endpoints autenticados?\r
□ Cores e tokens do projeto respeitados (#161410, #C41E00, #F2DAAC)?\r
□ Acessibilidade básica (alt, aria-label, role)?\r
```\r
 \r
### Backend (Node.js + Express + Prisma + Bun)\r
 \r
```\r
□ Validação de input com Zod na borda da API (middleware validateBody)?\r
□ Queries Prisma sem risco de N+1?\r
□ Transações usadas onde múltiplas escritas precisam ser atômicas?\r
□ Erros centralizados via AppError + middleware de erro global?\r
□ JWT verificado via jose antes de confiar em req.user?\r
□ Cookies com httpOnly + secure + sameSite: 'none' nos endpoints de auth?\r
□ Variáveis de ambiente acessadas via process.env — nunca hardcodadas?\r
□ Sem console.log em código de produção — usar logger estruturado?\r
□ Arquitetura routes → controllers → services → repositories respeitada?\r
```\r
 \r
### API REST e Semântica de Contrato\r
 \r
```\r
□ Status codes semânticos: 201 (criado), 401 (não autenticado), 403 (sem permissão), 422 (validação)?\r
□ Paginação em listagens de produtos/pedidos?\r
□ Rate limiting nas rotas de autenticação (/login, /register)?\r
□ CORS configurado com origins específicas (não *) e credentials: true?\r
□ Respostas de erro sem stack trace em produção?\r
□ IDOR checado — recurso pertence ao usuário autenticado?\r
□ Resposta segue um DTO explícito — sem vazar campos internos do Prisma (ex.: passwordHash)?\r
□ Nomenclatura de rota consistente com o resto da API (plural, REST-like)?\r
□ Mudança em contrato existente foi sinalizada como breaking change, ou é aditiva?\r
```\r
 \r
### Banco de Dados (PostgreSQL + Prisma + Neon)\r
 \r
```\r
□ Migrations com prisma migrate dev (não db push em produção)?\r
□ Índices nos campos de busca (email, userId nas relações)?\r
□ Campos NOT NULL onde faz sentido no domínio?\r
□ passwordHash nunca retornado nas respostas de API?\r
□ Schema drift entre banco e Prisma Client verificado (prisma generate)?\r
```\r
 \r
### Documentação\r
 \r
```\r
□ README atualizado se o setup/scripts do projeto mudaram?\r
□ REGRAS_DE_NEGOCIO.md atualizado (selo 🟡/🔵 → 🟢, ou nova regra registrada)?\r
□ ADR criado em /docs/architecture/adr/ para decisões arquiteturais relevantes?\r
□ Comentários no código explicam o "porquê" em lógica não óbvia (rate limit, regra de negócio específica, workaround)?\r
□ Documentação de API (Swagger/OpenAPI, se existir) atualizada junto com mudanças de contrato?\r
```\r
 \r
